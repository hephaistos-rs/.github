name: Update organization projects

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update project list in profile README
        uses: sansk/github-repo-display@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: hephaistos-rs
          topic: hephaistos-project
          format: list
          readme_path: .github/profile/README.md
          start_marker: <!-- PROJECTS:START -->
          end_marker: <!-- PROJECTS:END -->
          show_description: true
          show_language: true
          show_stars: false
          show_forks: false
          commit_message: 'docs(profile): update organization project list'
