name: Update organization projects

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update project list in profile README
        id: repo-display
        uses: sansk/github-repo-display@1dcfd1d5e09f870804cde2a6ff79f0632cd92c6e # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: hephaistos-rs
          topic: hephaistos-rs
          format: list
          readme_path: profile/README.md
          title: '🚀 Projects'
          start_marker: <!-- PROJECTS:START -->
          end_marker: <!-- PROJECTS:END -->
          show_description: true
          show_language: true
          show_stars: true
          show_forks: true
          show_topics: true
          commit_changes: false

      # The action always stamps "Updated on <date>", which made every run
      # commit. Strip it so only real changes (repos, descriptions, counts)
      # produce a diff.
      - name: Strip generated timestamp
        run: |
          perl -0pi -e 's/\n+---\n\*Updated on [^\n]*\*\n+(?=<!-- PROJECTS:END -->)/\n\n/' profile/README.md

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md
          git commit -m 'docs(profile): update organization project list'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summarize run
        run: |
          echo "### Project showcase update" >> "$GITHUB_STEP_SUMMARY"
          echo "Repositories matched (topic \`hephaistos-rs\`): **${{ steps.repo-display.outputs.repositories_count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "README changed: **${{ steps.commit.outputs.changed }}**" >> "$GITHUB_STEP_SUMMARY"
